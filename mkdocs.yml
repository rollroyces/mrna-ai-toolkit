site_name: mRNA × AI Toolkit
site_description: Practical Python tools for the AI-leverage layers in mRNA cancer therapy.
site_url: https://rollroyces.github.io/mrna-ai-toolkit/
repo_url: https://github.com/rollroyces/mrna-ai-toolkit
repo_name: rollroyces/mrna-ai-toolkit

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tools:
      - codon: tools/codon.md
      - neoantigen: tools/neoantigen.md
      - trial: tools/trial.md
      - lnp: tools/lnp.md
      - scrna: tools/scrna.md
  - Backends: backends.md
  - API reference: api.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rollroyces/mrna-ai-toolkit
  generator: false
